services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-info}
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/docforge-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  docforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: docforge:latest
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: http://localhost:8080
      # Keycloak is the local OAuth 2.1 / OIDC identity provider.
      AUTH_MODE: keycloak
      KEYCLOAK_ISSUER: http://localhost:8081/realms/docforge
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/docforge/protocol/openid-connect/certs
      KEYCLOAK_AUTHORIZATION_ENDPOINT: http://localhost:8081/realms/docforge/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_ENDPOINT: http://localhost:8081/realms/docforge/protocol/openid-connect/token
      KEYCLOAK_REGISTRATION_ENDPOINT: http://localhost:8081/realms/docforge/clients-registrations/openid-connect
      KEYCLOAK_REVOCATION_ENDPOINT: http://localhost:8081/realms/docforge/protocol/openid-connect/revoke
      KEYCLOAK_END_SESSION_ENDPOINT: http://localhost:8081/realms/docforge/protocol/openid-connect/logout
      AUTH_ISSUER: http://localhost:8081/realms/docforge
      AUTH_REST_RESOURCE: http://localhost:8080/api
      AUTH_MCP_RESOURCE: http://localhost:8080/mcp
      AUTH_API_AUDIENCE: http://localhost:8080/api
      AUTH_MCP_AUDIENCE: http://localhost:8080/mcp
      AUTH_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:6274,http://127.0.0.1:6274
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:6274,http://127.0.0.1:6274
      AUTH_DEMO_MODE: "false"
      CORS_ALLOW_ANY: "false"
      CONVERSION_CONCURRENCY: ${CONVERSION_CONCURRENCY:-4}
      CONVERSION_TIMEOUT_SECS: ${CONVERSION_TIMEOUT_SECS:-300}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
      MCP_MAX_INLINE_MB: ${MCP_MAX_INLINE_MB:-16}
      RUST_LOG: ${RUST_LOG:-docforge=info,tower_http=info}
    volumes:
      - docforge-data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  docforge-data:
  keycloak-data:
