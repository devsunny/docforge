[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/auth",
  "crates/mcp",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"

[patch.crates-io]
# Upstream declares a cdylib target for WASM. Building that target with the
# Windows GNU toolchain exceeds MinGW's export-ordinal limit, so the vendored
# copy keeps only the rlib target. The library API is unchanged.
office2pdf = { path = "vendor/office2pdf" }

[profile.release]
strip = true

[workspace.dependencies]
anyhow = "1.0.95"
async-trait = "0.1.83"
axum = { version = "0.8.1", features = ["macros", "multipart"] }
base64 = "0.22.1"
bytes = "1.9.0"
calamine = "0.26.1"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.5.23", features = ["derive", "env"] }
csv = "1.3.1"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.1.1", features = ["rand_core", "pkcs8"] }
encoding_rs = "0.8.35"
futures-util = "0.3.31"
http-body-util = "0.1.2"
image = { version = "0.24.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
mail-parser = "0.9.4"
ocrs = { version = "0.14.0", default-features = false, features = ["onnx"] }
office2pdf = "0.10.0"
msg_parser = "0.3.6"
parking_lot = "0.12.3"
pdf-render = "2.0.0"
pdf-extract = "0.8.0"
percent-encoding = "2.3.1"
printpdf = { version = "0.7.0", features = ["embedded_images"] }
quick-xml = { version = "0.36.2", features = ["serialize"] }
quoted_printable = "0.5.0"
rand = "0.8.5"
regex = "1.11.1"
rten = "0.28.0"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9.7"
resvg = "0.44.0"
roxmltree = "0.20.0"
rust_xlsxwriter = "0.79.3"
scraper = "0.22.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
serde_yaml = "0.9.34"
sha2 = { version = "0.10.8", features = ["oid"] }
subtle = "2.6.1"
tempfile = "3.15.0"
thiserror = "2.0.9"
tiny-skia = "0.11.4"
tokio = { version = "1.43.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["io"] }
toml = "0.8.19"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
url = { version = "2.5.4", features = ["serde"] }
usvg = "0.44.0"
uuid = { version = "1.11.0", features = ["serde", "v4"] }
which = "7.0.0"
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
