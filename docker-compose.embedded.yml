# Standalone docforge with its embedded OAuth 2.1 server. No Keycloak.
# Usage: docker compose -f docker-compose.embedded.yml up --build
services:
  docforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: docforge:embedded
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: http://localhost:8080
      AUTH_MODE: embedded
      AUTH_ISSUER: http://localhost:8080
      AUTH_REST_RESOURCE: http://localhost:8080/api
      AUTH_MCP_RESOURCE: http://localhost:8080/mcp
      AUTH_USERNAME: ${AUTH_USERNAME:-demo}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-demo}
      AUTH_DEMO_MODE: "true"
      AUTH_DCR_ENABLED: "true"
      AUTH_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:6274,http://127.0.0.1:6274
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:6274,http://127.0.0.1:6274
      CORS_ALLOW_ANY: "false"
      CONVERSION_CONCURRENCY: ${CONVERSION_CONCURRENCY:-4}
      CONVERSION_TIMEOUT_SECS: ${CONVERSION_TIMEOUT_SECS:-300}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
      MCP_MAX_INLINE_MB: ${MCP_MAX_INLINE_MB:-16}
      RUST_LOG: ${RUST_LOG:-docforge=info,tower_http=info}
    volumes:
      - docforge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  docforge-data:
