[package]
edition = "2024"
rust-version = "1.92"
name = "office2pdf"
version = "0.10.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Convert DOCX, XLSX, and PPTX files to PDF using pure Rust"
readme = "README.md"
keywords = [
    "pdf",
    "docx",
    "xlsx",
    "pptx",
    "converter",
]
categories = ["text-processing"]
license = "Apache-2.0"
repository = "https://github.com/developer0hye/office2pdf"

[lints.rust]
unused = "allow"
dead_code = "allow"

[features]
default = ["embedded-fonts"]
embedded-fonts = ["typst-kit/embedded-fonts"]
pdf-ops = ["lopdf"]
typescript = ["ts-rs"]
wasm = ["wasm-bindgen"]
wasm-cjk-font = ["wasm"]

[lib]
